name: Release

# Builds DiceRoller.exe and publishes a GitHub Release when a vX.Y.Z tag is pushed.
# The NIMVORO launcher downloads DiceRoller-win-x64.zip from the release (name set in nimvoro.json).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versions match the tag
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($pkg -ne $conf -or $pkg -ne $cargo) { throw "Version mismatch: package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo" }
          "VERSION=$pkg" >> $env:GITHUB_ENV
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$pkg") { throw "Tag ${{ github.ref_name }} does not match version $pkg" }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit tests (rules, dice geometry, physics)
        run: npm test

      - name: Type check and build the UI
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the exe
        run: npx tauri build --no-bundle

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item src-tauri/target/release/DiceRoller.exe pkg/
          Compress-Archive -Path pkg/* -DestinationPath DiceRoller-win-x64.zip -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { $tag = "v$env:VERSION" }
          gh release create $tag "DiceRoller-win-x64.zip" --title "Dice Roller $tag" --generate-notes --verify-tag
