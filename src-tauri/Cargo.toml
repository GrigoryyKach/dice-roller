[package]
name = "dice-roller"
version = "1.3.0"
description = "Dice Roller: 3D physics dice for the NIMVORO utility suite"
edition = "2021"

[lib]
name = "dice_roller_lib"
# Desktop only: cdylib is needed for mobile builds and breaks linking on the GNU toolchain.
crate-type = ["rlib"]
# Tests live in tests/logic.rs: only there can tauri-build inject the Windows manifest.
test = false
doctest = false

[[bin]]
name = "DiceRoller"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
